<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPM-101 Course Helpdesk · IIMBx</title>
<style>
  :root{--navy:#12306f;--red:#b02323;--ink:#1d2433;--mute:#667085;--line:#dfe3ec;--bg:#f6f7fb;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--ink:#e8ebf4;--mute:#9aa3b8;--line:#2b3347;--bg:#10141f;--card:#181d2b;--navy:#7f9cf0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh}
  header{background:#fff;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:14px;padding:6px 16px}
  header img{height:44px}
  header h1{font-size:1.05rem;margin:0;color:#12306f}
  header small{display:block;color:#667085;font-weight:400}
  #stats{display:flex;gap:10px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
  .stat{border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:.85rem;color:var(--mute)}
  .stat b{font-size:1.05rem;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
  #log{flex:1;overflow-y:auto;padding:18px 16px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:0 0 14px;display:flex;flex-direction:column}
  .msg.user{align-items:flex-end}
  .bubble{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--card)}
  .user .bubble{background:var(--navy);color:#fff;border-color:var(--navy)}
  .bot.err .bubble{border-color:var(--red)}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:var(--mute);align-items:center}
  .chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--card)}
  .chip.src{color:var(--navy);border-color:var(--navy)}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.6}}
  form{display:flex;gap:8px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
  input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
  input:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  button{padding:0 22px;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--mute);font-size:.9rem;text-align:center;margin:20px 0}
</style>
</head>
<body>
<header>
  <img src="/static/logo.png" alt="IIMB · IIMBx Digital Learning Foundation">
  <h1>DPM-101 Course Helpdesk<small>Answers come only from the official course documents</small></h1>
</header>
<div id="stats" aria-live="polite">
  <div class="stat"><b id="s-total">0</b>Total questions asked</div>
  <div class="stat"><b id="s-api">0</b>Gemini API calls made</div>
  <div class="stat"><b id="s-cache">0</b>Answers served from cache</div>
</div>
<main id="log">
  <p class="hint">Ask about deadlines, grading, fees, or exam rules. Follow-up questions work too.</p>
</main>
<form id="f" autocomplete="off">
  <input id="q" maxlength="500" placeholder="Type your question…" aria-label="Your question" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $=id=>document.getElementById(id), log=$('log'), input=$('q'), btn=$('send');
const sid=sessionStorage.getItem('sid')||(()=>{const s=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());sessionStorage.setItem('sid',s);return s})();
let busy=false;

function add(role,text,extra){
  const m=document.createElement('div');m.className='msg '+role+(extra&&extra.err?' err':'');
  const b=document.createElement('div');b.className='bubble';b.textContent=text;m.appendChild(b);
  if(extra&&extra.meta){const mt=document.createElement('div');mt.className='meta';
    extra.meta.forEach(([t,c])=>{const s=document.createElement('span');s.className='chip '+(c||'');s.textContent=t;mt.appendChild(s)});m.appendChild(mt)}
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
function loading(){
  const m=document.createElement('div');m.className='msg bot';
  m.innerHTML='<div class="bubble dots" role="status" aria-label="Looking this up"><span></span><span></span><span></span></div>';
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
async function stats(){
  try{const d=await (await fetch('/api/stats')).json();
    $('s-total').textContent=d.total_questions;$('s-api').textContent=d.gemini_api_calls;$('s-cache').textContent=d.served_from_cache}catch(e){}
}
function setBusy(v){busy=v;btn.disabled=v;input.disabled=v;if(!v)input.focus()}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  if(busy)return;                       // blocks double-clicks / Enter-spam
  const text=input.value.trim();if(!text)return;
  setBusy(true);add('user',text);input.value='';
  const l=loading();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:text})});
    const d=await r.json().catch(()=>({}));
    l.remove();
    const answer=typeof d.answer==='string'?d.answer:'Something went wrong. Please try again.';
    if(r.ok&&d.status==='ok'){
      const meta=[];
      if(d.in_docs&&d.sources.length)d.sources.forEach(s=>meta.push([s,'src']));
      else meta.push(['Not found in course documents','']);
      meta.push([d.served_from==='cache'?'from cache':'live answer','']);
      add('bot',answer,{meta});
    }else add('bot',answer,{err:true});
  }catch(err){l.remove();add('bot','Network problem — please check your connection and try again.',{err:true})}
  finally{setBusy(false);stats()}
});
stats();setInterval(stats,5000);
</script>
</body>
</html>
